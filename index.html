
<script>
const no = document.getElementById("no");

const warnings = [
  "Think again! 🤨",
  "Are you REALLY sure? 😭",
  "Bro, don't do this 💀",
  "Last chance... 😂",
  "JUST PRESS YES! 😈",
  "You can't escape the truth 🤣"
];

let attempts = 0;

function escapeButton() {
  const maxX = window.innerWidth - no.offsetWidth;
  const maxY = window.innerHeight - no.offsetHeight;

  no.textContent = warnings[attempts % warnings.length];
  attempts++;

  no.style.left = Math.random() * Math.max(0, maxX) + "px";
  no.style.top = Math.random() * Math.max(0, maxY) + "px";
}

no.addEventListener("touchstart", function(e) {
  e.preventDefault();
  escapeButton();
});

no.addEventListener("mouseover", escapeButton);

function reveal() {
  document.getElementById("question").style.display = "none";
  document.getElementById("result").style.display = "block";
}

function goBack() {
  document.getElementById("result").style.display = "none";
  document.getElementById("question").style.display = "block";
}
</script>
